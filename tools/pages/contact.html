<!--{"title":"Contact et devis — PURCA","desc":"Contactez PURCA et envoyez votre demande de devis pour du caoutchouc naturel TSR10 ou TSR20 par WhatsApp ou e-mail.","page":"contact"}-->
    <section class="page-hero">
      <div class="page-hero-bg" style="background-image:url(assets/img/plantation-liberia.jpg)" data-parallax="0.3"></div>
      <div class="container">
        <nav class="crumbs load-up" aria-label="Fil d'Ariane"><a href="index.html">Accueil</a><span>Contact</span></nav>
        <h1 data-split>Contact et devis</h1>
        <p class="lead load-up">Une question, une commande ? Indiquez le grade, la quantité et la destination : nous vous répondons rapidement.</p>
      </div>
    </section>

    <section class="section section-tight">
      <div class="container contact">
        <div class="contact-info">
          <a class="contact-card" data-site-href="tel" data-qc="phone"><svg class="ic"><use href="#i-phone"/></svg><span><small>Téléphone</small><b data-site="phone"></b></span></a>
          <a class="contact-card" id="qc-wa" target="_blank" rel="noopener"><svg class="ic"><use href="#i-wa"/></svg><span><small>WhatsApp</small><b>Écrire un message</b></span></a>
          <a class="contact-card" data-site-href="mailto" data-qc="email"><svg class="ic"><use href="#i-mail"/></svg><span><small>E-mail</small><b data-site="email"></b></span></a>
          <div class="contact-card"><svg class="ic"><use href="#i-pin"/></svg><span><small>Adresse</small><b data-site="address"></b></span></div>
          <div class="contact-card"><svg class="ic"><use href="#i-clock"/></svg><span><small>Horaires</small><b data-site="hours"></b></span></div>
        </div>

        <form id="quote" class="quote" novalidate>
          <h2>Demande de devis</h2>
          <div class="q-items">
            <div class="q-items-head"><span>Produits demandés</span><button type="button" class="link" id="q-clear">Tout retirer</button></div>
            <ul id="q-list"></ul>
            <div class="q-add">
              <label class="field"><span>Produit</span><select id="q-product"></select></label>
              <label class="field"><span>Quantité (t)</span><input id="q-qty" type="number" min="1" value="20"></label>
              <button type="button" class="btn btn-dark btn-square" id="q-add" aria-label="Ajouter le produit"><svg class="ic"><use href="#i-plus"/></svg></button>
            </div>
          </div>
          <div class="row">
            <label class="field"><span>Nom / Entreprise</span><input name="nom" required autocomplete="organization"></label>
            <label class="field"><span>Téléphone</span><input name="tel" type="tel" required autocomplete="tel"></label>
          </div>
          <label class="field"><span>Destination (pays / port de livraison)</span><input name="lieu"></label>
          <label class="field"><span>Message (optionnel)</span><textarea name="msg" rows="3"></textarea></label>
          <p class="form-err" id="form-err" role="alert"></p>
          <div class="row">
            <button class="btn btn-wa" type="submit" data-via="whatsapp"><svg class="ic"><use href="#i-wa"/></svg> Envoyer par WhatsApp</button>
            <button class="btn btn-dark" type="submit" data-via="email"><svg class="ic"><use href="#i-mail"/></svg> Envoyer par e-mail</button>
          </div>
        </form>
      </div>
      <div class="container"><div class="map"><iframe id="map" title="Localisation PURCA" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div></div>
    </section>
